# cbindgen configuration for numtoy-core
# Only generate bindings for the extern "C" functions in lib.rs.
# Internal modules (types, ir, fuser, hardware) are excluded.

language = "C"
include_guard = "NUMTOY_H"
autogen_warning = "/* WARNING: This file was auto-generated by cbindgen. Do not modify. */"

# Only process the top-level crate, not sub-modules with complex Rust syntax
parse_deps = false

[parse]
parse_deps = false

[export]
# Explicitly exclude the internal modules cbindgen cannot parse
exclude = ["DataType", "Scalar", "Expr", "HardwareEngine", "FusedOp", "MicroKernel"]
include = [
    "nt_engine_new",
    "nt_engine_free",
    "nt_expr_new_var",
    "nt_expr_new_const",
    "nt_expr_add",
    "nt_expr_mul",
    "nt_expr_free",
    "nt_expr_execute",
    "nt_expr_unpack",
]

[layout]
packed = false
aligned_n = false
